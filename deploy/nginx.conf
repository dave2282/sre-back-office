# /etc/nginx/sites-available/agent-portal  →  ln -s to sites-enabled, then: sudo certbot --nginx -d agents.resignature.com
server {
    listen 80;
    server_name agents.resignature.com;

    client_max_body_size 110m;   # a bit above MAX_UPLOAD_MB

    location /api/events {        # live updates (server-sent events) — no buffering
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;     # AI document scans can take a while
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
